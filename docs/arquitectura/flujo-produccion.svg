<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#346C3A"/></marker></defs>
<rect width="1400" height="990" fill="#F4F6F4"/>
<text x="40" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="bold" fill="#1B5E20">Unibán · Cosecha y despacho · Arquitectura offline-first</text>
<rect x="40" y="60" width="380" height="110" rx="14" fill="white" stroke="#92B398" stroke-width="2"/>
<text x="58" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1B5E20">Equipo 1</text>
<text x="58" y="116" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Aforamiento: plantas y confianza</text>
<text x="58" y="138" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Estimación; nunca saldo de producto</text>
<rect x="510" y="60" width="380" height="110" rx="14" fill="white" stroke="#92B398" stroke-width="2"/>
<text x="528" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1B5E20">Equipo 2</text>
<text x="528" y="116" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Recomendación semanal + plan de envío</text>
<text x="528" y="138" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Estimación decimal y carga entera separadas</text>
<rect x="980" y="60" width="380" height="110" rx="14" fill="white" stroke="#92B398" stroke-width="2"/>
<text x="998" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1B5E20">Backend Equipo 3</text>
<text x="998" y="116" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Archiva recomendación + ciclo + aforamiento</text>
<text x="998" y="138" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Conserva contratos externos y periodo ISO</text>
<rect x="40" y="270" width="420" height="145" rx="14" fill="white" stroke="#92B398" stroke-width="2"/>
<text x="58" y="300" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1B5E20">Compose → ViewModel → Repository</text>
<text x="58" y="326" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Productor confirma cantidades y fechas reales</text>
<text x="58" y="348" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Siembra: Preparación · Cosecha: Producción</text>
<text x="58" y="370" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Despacho: Producción o Descanso</text>
<rect x="40" y="485" width="420" height="155" rx="14" fill="white" stroke="#92B398" stroke-width="2"/>
<text x="58" y="515" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1B5E20">Room 11 · primero local</text>
<text x="58" y="541" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Planes de origen + cosechas + despachos</text>
<text x="58" y="563" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Actividad COSECHA con el mismo UUID</text>
<text x="58" y="585" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Despacho y consumos en una transacción</text>
<text x="58" y="607" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Pendientes y errores visibles sin conexión</text>
<rect x="540" y="485" width="360" height="155" rx="14" fill="white" stroke="#92B398" stroke-width="2"/>
<text x="558" y="515" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1B5E20">WorkManager + Retrofit</text>
<text x="558" y="541" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">UUID estable en cada reintento</text>
<text x="558" y="563" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">1. Movimientos independientes / entradas</text>
<text x="558" y="585" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">2. Cosechas estructuradas</text>
<text x="558" y="607" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">3. Despachos y sus empaques juntos</text>
<rect x="980" y="270" width="380" height="155" rx="14" fill="white" stroke="#92B398" stroke-width="2"/>
<text x="998" y="300" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1B5E20">FastAPI /api/v1</text>
<text x="998" y="326" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Token y pertenencia al productor</text>
<text x="998" y="348" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Validación de ciclo, etapa y recomendación</text>
<text x="998" y="370" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Bloqueo de parcela e inventario</text>
<text x="998" y="392" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Idempotencia + cupo + saldo + empaques</text>
<rect x="980" y="485" width="380" height="155" rx="14" fill="white" stroke="#92B398" stroke-width="2"/>
<text x="998" y="515" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1B5E20">PostgreSQL · Alembic 0013</text>
<text x="998" y="541" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">harvests / dispatches / movements.dispatch_id</text>
<text x="998" y="563" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Actividad y cosecha enlazadas 1 a 0..1</text>
<text x="998" y="585" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Una transacción por operación</text>
<text x="998" y="607" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">GET de avance: sin llamar al Equipo 2</text>
<rect x="40" y="760" width="1320" height="160" rx="14" fill="white" stroke="#92B398" stroke-width="2"/>
<text x="58" y="790" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1B5E20">Reglas del balance real</text>
<text x="58" y="816" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Racimos cosechados − racimos despachados = racimos disponibles</text>
<text x="58" y="838" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Un cupo por parcela + periodo; pedir otra recomendación no duplica la porción semanal</text>
<text x="58" y="860" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Empaques enteros acumulados: redondeo hacia arriba y tope en el total entero del plan</text>
<text x="58" y="882" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#24362A">Ningún faltante permite completar parcialmente un despacho; primero registrar una entrada</text>
