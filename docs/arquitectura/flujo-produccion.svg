<path d="M250,415 V485" fill="none" stroke="#346C3A" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M460,562 H540" fill="none" stroke="#346C3A" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M900,562 H980" fill="none" stroke="#346C3A" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M720,485 V345 H980" fill="none" stroke="#346C3A" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1170,640 V705 H250 V640" fill="none" stroke="#346C3A" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="370" y="696" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#346C3A">Avance recibido → Room; se preservan operaciones locales pendientes</text>
<text x="40" y="960" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#58715E">Equipo 3 · 28/10/2026 · Las validaciones locales se repiten en el servidor al sincronizar.</text></svg>